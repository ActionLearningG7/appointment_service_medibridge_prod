spring:
  # Database Configuration (Production)
  datasource:
    url: jdbc:mysql://${DB_HOST:prod-db}:${DB_PORT:3306}/${DB_NAME:medibridge_appointments_prod}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:produser}
    password: ${DB_PASSWORD:***CONFIGURE_ME***}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration (Production)
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis Configuration (Production)
  data:
    redis:
      url: ${REDIS_URL:redis://prod-redis:6379}

  # Kafka Configuration (Production)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:prod-kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: appointment-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

  # Mail Configuration (Production)
  mail:
    host: ${SMTP_HOST:mail-prod.internal}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USER:***CONFIGURE_ME***}
    password: ${SMTP_PASSWORD:***CONFIGURE_ME***}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

app:
  mail:
    from: ${MAIL_FROM:noreply@medibridge.com}

# Logging (Production)
logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.medibridge: INFO
    org.springframework.data.redis: WARN

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_PROTOCOL:https}://${EUREKA_HOST:eureka-prod}:${EUREKA_PORT:443}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90