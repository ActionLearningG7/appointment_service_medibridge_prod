spring:
  application:
    name: appointment-service
  profiles:
    active: ${SPRING_PROFILE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medibridge_appointments}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Prakash@1}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${spring.application.name}-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api/v1

# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_PROTOCOL:http}://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Application-Specific Configuration (non-env dependent)
appointment:
  queue:
    default-avg-consultation-minutes: 15
    max-patients-per-queue: 100
    no-show-grace-period-minutes: 3
    token-allocation-lock-timeout-seconds: 5
  video:
    default-provider: STUB
    session-token-validity-minutes: 60
  redis:
    queue-cache-ttl-hours: 24
    idempotency-ttl-hours: 24
  kafka:
    topics:
      appointments: medibridge.appointments.events
      queue: medibridge.queue.events
      video: medibridge.video.events
      user: medibridge.user.events
    outbox-publisher-interval-ms: 5000
