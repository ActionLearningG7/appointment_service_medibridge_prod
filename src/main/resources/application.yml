spring:
  application:
    name: appointment-service
  profiles:
    active: dev

server:
  port: 8083
  servlet:
    context-path: /api/v1



# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Application-Specific Configuration (non-env dependent)
appointment:
  queue:
    default-avg-consultation-minutes: 15
    max-patients-per-queue: 100
    no-show-grace-period-minutes: 3
    token-allocation-lock-timeout-seconds: 5
  video:
    default-provider: STUB
    session-token-validity-minutes: 60
  redis:
    queue-cache-ttl-hours: 24
    idempotency-ttl-hours: 24
  kafka:
    topics:
      appointments: medibridge.appointments.events
      queue: medibridge.queue.events
      video: medibridge.video.events
      user: medibridge.user.events
    outbox-publisher-interval-ms: 5000
